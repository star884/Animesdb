<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniStream - Watch Free Anime</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- HLS.js script for playing .m3u8 streams -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">Ani<span>Stream</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search anime...">
      <button id="searchBtn">Search</button>
    </div>
  </nav>

  <!-- Hero Featured Banner -->
  <header class="hero" id="heroBanner">
    <div class="hero-content">
      <h1 id="heroTitle">Loading Catalog...</h1>
      <p id="heroDesc">Fetching anime metadata from API databases.</p>
      <button class="play-btn" id="heroPlayBtn">Watch Now</button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="container">
    <section class="section">
      <h2>🔥 Trending Now</h2>
      <div class="anime-grid" id="trendingGrid"></div>
    </section>

    <section class="section">
      <h2>⭐ Most Popular</h2>
      <div class="anime-grid" id="popularGrid"></div>
    </section>
  </main>

  <!-- Streaming & Details Modal -->
  <div class="modal" id="videoModal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <h2 id="modalTitle">Anime Title</h2>
      
      <div class="player-wrapper">
        <video id="videoPlayer" controls></video>
      </div>

      <div class="stream-controls">
        <label for="epSelect">Episode: </label>
        <select id="epSelect"></select>
        
        <label for="serverSelect">Quality / Server: </label>
        <select id="serverSelect"></select>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
