<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AniStream - Watch Free Anime</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- Video.js for player UI & HLS -->
  <link href="https://vjs.zencdn.net/8.21.0/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.21.0/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
  <nav class="navbar">
    <div class="logo">Ani<span>Stream</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search anime..." aria-label="Search anime" />
      <button id="searchBtn" aria-label="Search">Search</button>
    </div>
  </nav>

  <header class="hero" id="heroBanner" role="banner" aria-hidden="false">
    <div class="hero-content">
      <h1 id="heroTitle">Loading Catalog...</h1>
      <p id="heroDesc">Fetching anime metadata.</p>
      <button class="play-btn" id="heroPlayBtn">Watch Now</button>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h2 id="trendingTitle">🔥 Trending Now</h2>
      <div class="anime-grid" id="trendingGrid" aria-live="polite"></div>
    </section>

    <section class="section">
      <h2 id="popularTitle">⭐ Most Popular</h2>
      <div class="anime-grid" id="popularGrid"></div>
    </section>
  </main>

  <div class="modal" id="videoModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content" role="document">
      <button class="close-btn" id="closeModal" aria-label="Close player">&times;</button>
      <h2 id="modalTitle">Anime Title</h2>

      <div class="player-wrapper">
        <!-- Video.js player -->
        <video id="videoPlayer" class="video-js vjs-theme-sea" controls preload="auto" playsinline></video>
      </div>

      <div class="stream-controls">
        <label for="epSelect">Episode: </label>
        <select id="epSelect" aria-label="Episode selection"></select>

        <label for="serverSelect">Server / Quality: </label>
        <select id="serverSelect" aria-label="Server quality selection"></select>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
        </html>
