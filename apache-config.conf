<VirtualHost *:10000>

    ServerName localhost
    DocumentRoot /var/www/html

    # Make index.php the only application entrypoint.
    DirectoryIndex index.php

    <Directory /var/www/html>

        # Never show a directory listing.
        Options -Indexes +FollowSymLinks

        # Allow .htaccess files if one is added later.
        AllowOverride All

        # Allow the application to be served.
        Require all granted

        # SPA-style fallback.
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            # Do not rewrite existing files.
            RewriteCond %{REQUEST_FILENAME} -f [OR]

            # Do not rewrite existing directories.
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]

            # Send application routes to index.php.
            RewriteRule ^ index.php [L,QSA]
        </IfModule>

    </Directory>

    # Security headers.
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    # Compression.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE \
            text/html \
            text/plain \
            text/css \
            text/javascript \
            application/javascript \
            application/json \
            application/xml \
            image/svg+xml
    </IfModule>

    # Browser caching.
    <IfModule mod_expires.c>
        ExpiresActive On

        ExpiresByType text/html "access plus 0 seconds"
        ExpiresByType application/json "access plus 0 seconds"

        ExpiresByType text/css "access plus 7 days"
        ExpiresByType application/javascript "access plus 7 days"

        ExpiresByType image/jpeg "access plus 30 days"
        ExpiresByType image/png "access plus 30 days"
        ExpiresByType image/gif "access plus 30 days"
        ExpiresByType image/webp "access plus 30 days"
        ExpiresByType font/woff2 "access plus 30 days"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/trianime-error.log
    CustomLog ${APACHE_LOG_DIR}/trianime-access.log combined

</VirtualHost>
